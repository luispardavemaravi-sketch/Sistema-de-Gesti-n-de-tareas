server:
  port: 8080

spring:
  application:
    name: sistema-gestion-tareas

  autoconfigure:
    exclude:
      - org.springdoc.core.configuration.SpringDocDataRestConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/sistematareas
    username: postgres
    password: hola123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true